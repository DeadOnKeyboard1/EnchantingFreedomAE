; Enchanting Freedom SE/AE configuration
; Changes are loaded when Skyrim starts.

[EnchantingFreedom]
EnableEnchantmentSlotLimit=true
; Valid range: 1-50
EnchantmentMaxSlots=50
RemoveEnchantingRestrictions=true
RemoveDisenchantingRestrictions=true

[Exclusions]
; Comma-separated entries: hexadecimal local FormID|Plugin or *|Plugin
Enchantments=
Items=
