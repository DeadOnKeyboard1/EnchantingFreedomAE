; Enchanting Freedom AE 1.3.0 configuration
; Changes are loaded when Skyrim starts.

[EnchantingFreedom]
EnableEnchantmentSlotLimit=true

; Valid range: 1-50
EnchantmentMaxSlots=50

; Removes ENCH wornRestrictions so armor enchantments are no longer tied to
; specific armor/clothing slots.
RemoveEnchantingRestrictions=true

; Removes MagicDisallowEnchanting from loaded ARMO, WEAP and ENCH records.
RemoveDisenchantingRestrictions=true

; Allows items whose enchantment the player already knows to remain enabled
; in the Disenchant list. The learned ENCH stays known; this does NOT make
; the player forget the enchantment.
AllowDisenchantKnownEnchantments=true

; EXPERIMENTAL / dangerous. Skyrim normally blocks runtime-created FFxxxxxx
; enchantments (including many player-created enchantments) from disenchanting.
; Keep this false for the safest behavior. Normal modded ESP/ESM/ESL ENCH records
; are NOT affected by this protection and remain supported.
AllowDisenchantCreatedEnchantments=false

; Allows staves to enter the normal weapon enchanting/disenchanting categories.
AllowStaves=true

; DANGEROUS / unusual content. Hidden/non-playable forms are protected by default.
AllowNonPlayableItems=false

; DANGEROUS. Disenchanting destroys the item. Enabling this can destroy quest
; items and break quests. The bypass is limited to the EnchantConstructMenu
; quest-item check.
AllowQuestItems=false

; Re-applies record patches whenever the Crafting Menu opens. This helps when
; another DLL modifies loaded records after DataLoaded.
RefreshOnCraftingMenuOpen=true

[Exclusions]
; Comma-separated entries: hexadecimal local FormID|Plugin or *|Plugin
Enchantments=
Items=
